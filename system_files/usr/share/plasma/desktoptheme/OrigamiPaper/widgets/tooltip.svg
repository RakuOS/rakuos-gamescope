<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Origami Paper Dark - Tooltip Background -->
  <!-- SURFACE = #272A2E, DIVIDER = #38393E -->

  <!-- Corner elements (DIVIDER border color) -->
  <rect id="topleft" x="0" y="0" width="3" height="3" fill="#38393E"/>
  <rect id="topright" x="97" y="0" width="3" height="3" fill="#38393E"/>
  <rect id="bottomleft" x="0" y="97" width="3" height="3" fill="#38393E"/>
  <rect id="bottomright" x="97" y="97" width="3" height="3" fill="#38393E"/>

  <!-- Edge elements (DIVIDER border color) -->
  <rect id="top" x="3" y="0" width="94" height="3" fill="#38393E"/>
  <rect id="bottom" x="3" y="97" width="94" height="3" fill="#38393E"/>
  <rect id="left" x="0" y="3" width="3" height="94" fill="#38393E"/>
  <rect id="right" x="97" y="3" width="3" height="94" fill="#38393E"/>

  <!-- Center (SURFACE) -->
  <rect id="center" x="3" y="3" width="94" height="94" fill="#272A2E"/>

  <!-- Hints -->
  <rect id="hint-stretch-borders" x="0" y="0" width="0" height="0" fill="none"/>
  <rect id="hint-compose-over-border" x="0" y="0" width="0" height="0" fill="none"/>
</svg>
