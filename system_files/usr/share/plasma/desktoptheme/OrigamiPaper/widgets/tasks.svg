<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="312" viewBox="0 0 100 312">
  <!-- Origami Paper Dark - Task Manager Button States -->

  <!-- normal: transparent -->
  <rect id="normal" x="0" y="0" width="100" height="52" rx="4" fill="none"/>

  <!-- hover: HOVER (#393B3F) at 60% opacity -->
  <rect id="hover" x="0" y="52" width="100" height="52" rx="4" fill="#393B3F" fill-opacity="0.6"/>

  <!-- focus: ACCENT (#81A1C1) at 60% opacity -->
  <rect id="focus" x="0" y="104" width="100" height="52" rx="4" fill="#81A1C1" fill-opacity="0.6"/>

  <!-- attention: DESTRUCTIVE (#BF616A) at 60% opacity -->
  <rect id="attention" x="0" y="156" width="100" height="52" rx="4" fill="#BF616A" fill-opacity="0.6"/>

  <!-- minimized: WINDOW (#1A1D24) at 40% opacity -->
  <rect id="minimized" x="0" y="208" width="100" height="52" rx="4" fill="#1A1D24" fill-opacity="0.4"/>

  <!-- last-focused: ACCENT (#81A1C1) at 60% opacity (same as focus) -->
  <rect id="last-focused" x="0" y="260" width="100" height="52" rx="4" fill="#81A1C1" fill-opacity="0.6"/>
</svg>
