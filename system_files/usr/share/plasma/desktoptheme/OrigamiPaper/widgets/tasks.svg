<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="310" viewBox="0 0 200 310">

  <!--
    Origami Paper Dark — Task Manager Button States
    ═══════════════════════════════════════════════
    Left column  (x=0):   non-directional fallbacks (top/left/right panels)
    Right column (x=110): south-* 9-part elements for bottom panels

    For bottom panels Plasma uses south-{state}-center (background) and
    south-{state}-bottom (the indicator strip at the button's bottom edge).
    Missing 9-part pieces (top/left/right/corners) are treated as zero-size.
  -->

  <!-- ── Fallback elements (non-bottom panels) ─────────────────────────── -->

  <rect id="normal"    x="0" y="0"   width="100" height="52" fill="none"/>
  <rect id="hover"     x="0" y="52"  width="100" height="52" rx="4" fill="#393B3F" fill-opacity="0.50"/>
  <rect id="focus"     x="0" y="104" width="100" height="52" rx="4" fill="#81A1C1" fill-opacity="0.20"/>
  <rect id="attention" x="0" y="156" width="100" height="52" rx="4" fill="#BF616A" fill-opacity="0.60"/>
  <rect id="minimized" x="0" y="208" width="100" height="52" fill="none"/>

  <!-- ── south-normal (open window, not active) ────────────────────────── -->
  <rect id="south-normal-center" x="110" y="0"  width="80" height="48" fill="none"/>
  <rect id="south-normal-bottom" x="110" y="48" width="80" height="4"  rx="2" fill="#81A1C1" fill-opacity="0.45"/>

  <!-- ── south-hover (mouse over any task) ─────────────────────────────── -->
  <rect id="south-hover-center" x="110" y="60"  width="80" height="48" rx="4" fill="#393B3F" fill-opacity="0.50"/>
  <rect id="south-hover-bottom" x="110" y="108" width="80" height="4"  fill="none"/>

  <!-- ── south-focus (active window) ───────────────────────────────────── -->
  <rect id="south-focus-center" x="110" y="120" width="80" height="48" rx="4" fill="#81A1C1" fill-opacity="0.12"/>
  <rect id="south-focus-bottom" x="110" y="168" width="80" height="4"  rx="2" fill="#81A1C1"/>

  <!-- ── south-attention (app demands attention) ───────────────────────── -->
  <rect id="south-attention-center" x="110" y="180" width="80" height="48" rx="4" fill="#BF616A" fill-opacity="0.60"/>
  <rect id="south-attention-bottom" x="110" y="228" width="80" height="4"  fill="none"/>

  <!-- ── south-minimized (window minimized) ────────────────────────────── -->
  <rect id="south-minimized-center" x="110" y="240" width="80" height="48" fill="none"/>
  <rect id="south-minimized-bottom" x="110" y="288" width="80" height="4"  rx="2" fill="#81A1C1" fill-opacity="0.25"/>

</svg>
