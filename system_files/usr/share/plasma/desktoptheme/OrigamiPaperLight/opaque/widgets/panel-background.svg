<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44">
  <!-- Origami Paper Light - Panel Background (Opaque)                   -->
  <!-- Corners use bezier-approximated quarter-circles (r≈6).            -->
  <!-- Docked: screen edge clips the outer corners.                      -->
  <!-- Floating: full rounding visible, KWin adds drop shadow.           -->

  <!-- Corners (6×6) -->
  <g id="topleft">
    <path fill="#DFE1E4" d="M 0,6 H 6 V 0 C 2,0 0,2 0,6 Z"/>
  </g>
  <g id="topright" transform="translate(38,0)">
    <path fill="#DFE1E4" d="M 0,0 V 6 H 6 C 6,2 4,0 0,0 Z"/>
  </g>
  <g id="bottomleft" transform="translate(0,38)">
    <path fill="#DFE1E4" d="M 6,6 V 0 H 0 c 0,4 2,6 6,6 z"/>
  </g>
  <g id="bottomright" transform="translate(38,38)">
    <path fill="#DFE1E4" d="M 0,6 V 0 H 6 C 6,4 4,6 0,6 Z"/>
  </g>

  <!-- Edges (between corners) -->
  <g id="top" transform="translate(6,0)">
    <rect fill="#DFE1E4" width="32" height="6"/>
  </g>
  <g id="bottom" transform="translate(6,38)">
    <rect fill="#DFE1E4" width="32" height="6"/>
  </g>
  <g id="left">
    <rect fill="#DFE1E4" y="6" width="6" height="32"/>
  </g>
  <g id="right" transform="translate(38,0)">
    <rect fill="#DFE1E4" y="6" width="6" height="32"/>
  </g>

  <!-- Center -->
  <g id="center" transform="translate(6,6)">
    <rect fill="#DFE1E4" width="32" height="32"/>
  </g>

  <!-- Content margin hints (size = inset amount) -->
  <rect id="hint-top-margin"    fill="none" x="20" y="0"  width="4" height="4"/>
  <rect id="hint-bottom-margin" fill="none" x="20" y="40" width="4" height="4"/>
  <rect id="hint-left-margin"   fill="none" x="0"  y="20" width="4" height="4"/>
  <rect id="hint-right-margin"  fill="none" x="40" y="20" width="4" height="4"/>
  <rect id="hint-compose-over-border" fill="none" x="0" y="0" width="0" height="0"/>
</svg>
