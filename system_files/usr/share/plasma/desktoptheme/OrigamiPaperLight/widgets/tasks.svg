<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="312" viewBox="0 0 100 312">
  <!-- Origami Paper Light - Task Manager Button States -->

  <!-- normal: transparent -->
  <rect id="normal" x="0" y="0" width="100" height="52" rx="4" fill="none"/>

  <!-- hover: DIVIDER (#CCCED2) at 70% opacity -->
  <rect id="hover" x="0" y="52" width="100" height="52" rx="4" fill="#CCCED2" fill-opacity="0.7"/>

  <!-- focus: ACCENT (#5E81AC) at 50% opacity -->
  <rect id="focus" x="0" y="104" width="100" height="52" rx="4" fill="#5E81AC" fill-opacity="0.5"/>

  <!-- attention: DESTRUCTIVE (#9A4F56) at 50% opacity -->
  <rect id="attention" x="0" y="156" width="100" height="52" rx="4" fill="#9A4F56" fill-opacity="0.5"/>

  <!-- minimized: SURFACE (#DFE1E4) at 50% opacity -->
  <rect id="minimized" x="0" y="208" width="100" height="52" rx="4" fill="#DFE1E4" fill-opacity="0.5"/>

  <!-- last-focused: ACCENT (#5E81AC) at 50% opacity -->
  <rect id="last-focused" x="0" y="260" width="100" height="52" rx="4" fill="#5E81AC" fill-opacity="0.5"/>
</svg>
