<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Origami Paper Light - Dialog/Popup Background -->
  <!-- WINDOW = #ECEFF4, DIVIDER = #CCCED2 -->

  <rect id="topleft"     x="0"  y="0"  width="3"  height="3"  fill="#CCCED2"/>
  <rect id="topright"    x="97" y="0"  width="3"  height="3"  fill="#CCCED2"/>
  <rect id="bottomleft"  x="0"  y="97" width="3"  height="3"  fill="#CCCED2"/>
  <rect id="bottomright" x="97" y="97" width="3"  height="3"  fill="#CCCED2"/>

  <rect id="top"    x="3"  y="0"  width="94" height="3"  fill="#CCCED2"/>
  <rect id="bottom" x="3"  y="97" width="94" height="3"  fill="#CCCED2"/>
  <rect id="left"   x="0"  y="3"  width="3"  height="94" fill="#CCCED2"/>
  <rect id="right"  x="97" y="3"  width="3"  height="94" fill="#CCCED2"/>

  <rect id="center" x="3" y="3" width="94" height="94" fill="#ECEFF4"/>

  <rect id="hint-stretch-borders"    x="0" y="0" width="0" height="0" fill="none"/>
