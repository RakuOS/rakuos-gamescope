<?xml version="1.0" encoding="UTF-8"?>
<svg width="150" height="30" viewBox="0 0 150 30" xmlns="http://www.w3.org/2000/svg">
  <!-- active -->
  <g id="active-center" transform="translate(0,0)">
    <rect x="0" y="0" width="30" height="30" fill="#ECEFF4" fill-opacity="0.01"/>
    <line x1="9" y1="9" x2="21" y2="21" stroke="#262A31" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="21" y1="9" x2="9" y2="21" stroke="#262A31" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- hover -->
  <g id="hover-center" transform="translate(30,0)">
    <rect x="3" y="3" width="24" height="24" rx="4" fill="#000000" fill-opacity="0.08"/>
    <line x1="9" y1="9" x2="21" y2="21" stroke="#262A31" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="21" y1="9" x2="9" y2="21" stroke="#262A31" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- pressed -->
  <g id="pressed-center" transform="translate(60,0)">
    <rect x="3" y="3" width="24" height="24" rx="4" fill="#000000" fill-opacity="0.14"/>
    <line x1="9" y1="9" x2="21" y2="21" stroke="#262A31" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="21" y1="9" x2="9" y2="21" stroke="#262A31" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <!-- inactive -->
  <g id="inactive-center" transform="translate(90,0)">
    <rect x="0" y="0" width="30" height="30" fill="#ECEFF4" fill-opacity="0.01"/>
    <line x1="9" y1="9" x2="21" y2="21" stroke="#6C7080" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="21" y1="9" x2="9" y2="21" stroke="#6C7080" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- deactivated -->
  <g id="deactivated-center" transform="translate(120,0)">
    <rect x="0" y="0" width="30" height="30" fill="#ECEFF4" fill-opacity="0.01"/>
    <line x1="9" y1="9" x2="21" y2="21" stroke="#A8ACBA" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="21" y1="9" x2="9" y2="21" stroke="#A8ACBA" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
