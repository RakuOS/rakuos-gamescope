# ============================================================
# RakuOS KDE Image — GitLab CI/CD Pipeline
# ============================================================

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never

variables:
  IMAGE_REGISTRY: "registry.gitlab.com/rakuos/images/rakuos-kde"
  IMAGE_REGISTRY_NVIDIA: "registry.gitlab.com/rakuos/images/rakuos-kde/nvidia"
  DEFAULT_TAG: "latest"
  IMAGE_DESC: "RakuOS KDE"
  IMAGE_KEYWORDS: "bootc,fedora,atomic,kde,plasma"
  TITANOBOA_REPO: "https://gitlab.com/rakuos/iso/rakuos-forge.git"
  TITANOBOA_REF: "main"
  ISO_CONFIG_REPO: "https://gitlab.com/rakuos/iso/rakuos-kde-iso.git"

stages:
  - build
  - test-iso
  - push
  - cleanup
  - dispatch

.buildah-job:
  image: quay.io/buildah/stable:latest
  tags:
    - saas-linux-2xlarge-amd64
  before_script:
    - |
      case "${CI_COMMIT_BRANCH}" in
        "${CI_DEFAULT_BRANCH}")
          export BRANCH_SLUG="${DEFAULT_TAG}"
          ;;
        "staging")
          export BRANCH_SLUG="staging"
          ;;
        "rawhide")
          export BRANCH_SLUG="rawhide"
          ;;
        "rakuosel")
          export BRANCH_SLUG="rakuosel"
          ;;
        *)
          export BRANCH_SLUG="$(printf '%s' "${CI_COMMIT_BRANCH}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._-]#-#g')"
          ;;
      esac
      export BASE_IMAGE_TAG="${BRANCH_SLUG}"
      echo "Using branch slug: ${BRANCH_SLUG}"
      echo "Pulling base image tag: ${BASE_IMAGE_TAG}"
    - export DATE_TAG="$(date -u +%Y%m%d)"
  variables:
    STORAGE_DRIVER: overlay
    BUILDAH_FORMAT: docker

build-base:
  extends: .buildah-job
  stage: build
  script:
    - |
      if [ "${CI_COMMIT_BRANCH}" = "${CI_DEFAULT_BRANCH}" ]; then
        TAGS="${IMAGE_REGISTRY}:${DEFAULT_TAG} ${IMAGE_REGISTRY}:${DEFAULT_TAG}.${DATE_TAG} ${IMAGE_REGISTRY}:${DATE_TAG}"
      else
        TAGS="${IMAGE_REGISTRY}:${BRANCH_SLUG} ${IMAGE_REGISTRY}:${BRANCH_SLUG}.${DATE_TAG}"
      fi
      export TAGS BRANCH_SLUG
      printf 'TAGS=%s\nBRANCH_SLUG=%s\n' "${TAGS}" "${BRANCH_SLUG}" > build-base.env

    - export TEMP_TAG="${IMAGE_REGISTRY}:ci-temp-${CI_PIPELINE_ID}"

    - |
      buildah build \
        --file Containerfile \
        --build-arg BASE_IMAGE_TAG="${BASE_IMAGE_TAG}" \
        --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        --label "org.opencontainers.image.description=${IMAGE_DESC}" \
        --label "org.opencontainers.image.source=${CI_PROJECT_URL}" \
        --label "org.opencontainers.image.revision=${CI_COMMIT_SHA}" \
        --label "org.opencontainers.image.vendor=RakuOS" \
        --label "org.opencontainers.image.keywords=${IMAGE_KEYWORDS}" \
        --label "containers.bootc=1" \
        --tag "${TEMP_TAG}" \
        .

    - |
      if [ "${CI_PIPELINE_SOURCE}" != "merge_request_event" ]; then
        buildah login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" registry.gitlab.com
        echo "Pushing temporary image ${TEMP_TAG}..."
        buildah push "${TEMP_TAG}"
      fi
  artifacts:
    reports:
      dotenv: build-base.env
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "staging"'
    - if: '$CI_COMMIT_BRANCH == "rawhide"'
    - if: '$CI_COMMIT_BRANCH == "rakuosel"'

build-nvidia:
  extends: .buildah-job
  stage: build
  script:
    - |
      if [ "${CI_COMMIT_BRANCH}" = "${CI_DEFAULT_BRANCH}" ]; then
        TAGS="${IMAGE_REGISTRY_NVIDIA}:${DEFAULT_TAG} ${IMAGE_REGISTRY_NVIDIA}:${DEFAULT_TAG}.${DATE_TAG} ${IMAGE_REGISTRY_NVIDIA}:${DATE_TAG}"
      else
        TAGS="${IMAGE_REGISTRY_NVIDIA}:${BRANCH_SLUG} ${IMAGE_REGISTRY_NVIDIA}:${BRANCH_SLUG}.${DATE_TAG}"
      fi
      export TAGS BRANCH_SLUG
      printf 'TAGS_NVIDIA=%s\nBRANCH_SLUG=%s\n' "${TAGS}" "${BRANCH_SLUG}" > build-nvidia.env

    - export TEMP_TAG="${IMAGE_REGISTRY_NVIDIA}:ci-temp-${CI_PIPELINE_ID}"

    - |
      buildah build \
        --file Containerfile.nvidia \
        --build-arg BASE_IMAGE_TAG="${BASE_IMAGE_TAG}" \
        --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        --label "org.opencontainers.image.description=${IMAGE_DESC} (NVIDIA)" \
        --label "org.opencontainers.image.source=${CI_PROJECT_URL}" \
        --label "org.opencontainers.image.revision=${CI_COMMIT_SHA}" \
        --label "org.opencontainers.image.vendor=RakuOS" \
        --label "org.opencontainers.image.keywords=${IMAGE_KEYWORDS}" \
        --label "containers.bootc=1" \
        --tag "${TEMP_TAG}" \
        .

    - |
      if [ "${CI_PIPELINE_SOURCE}" != "merge_request_event" ]; then
        buildah login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" registry.gitlab.com
        echo "Pushing temporary image ${TEMP_TAG}..."
        buildah push "${TEMP_TAG}"
      fi
  artifacts:
    reports:
      dotenv: build-nvidia.env
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "staging"'
    - if: '$CI_COMMIT_BRANCH == "rawhide"'
    - if: '$CI_COMMIT_BRANCH == "rakuosel"'

.trigger-on-build-fail:
  stage: build
  image: quay.io/fedora/fedora:latest
  tags:
    - saas-linux-2xlarge-amd64
  allow_failure: true
  script:
    - |
      set -euo pipefail
      dnf install -y curl jq
      echo "Cleaning up temp tags for pipeline ${CI_PIPELINE_ID}..."
      TEMP_TAG_NAME="ci-temp-${CI_PIPELINE_ID}"
      REPOS=$(curl -sf --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
        "https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/registry/repositories?per_page=20")
      for REPO_ID in $(echo "${REPOS}" | grep -o '"id":[0-9]*' | grep -o '[0-9]*'); do
        curl -sf -X DELETE \
          --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
          "https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/registry/repositories/${REPO_ID}/tags/${TEMP_TAG_NAME}" || true
      done
      echo "Temp tag cleanup complete."
      cancel_sibling() {
        local proj_id="$1"
        local proj_name="$2"
        if [ "${proj_id}" = "${CI_PROJECT_ID}" ]; then
          return 0
        fi
        for STATUS in running pending; do
          PIDS=$(curl -sf \
            --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
            "https://gitlab.com/api/v4/projects/${proj_id}/pipelines?ref=${CI_COMMIT_BRANCH}&status=${STATUS}&per_page=5" \
            | grep -o '"id":[0-9]*' | grep -o '[0-9]*' || true)
          for PID in ${PIDS}; do
            echo "Cancelling ${proj_name} pipeline ${PID} (${STATUS}) on ${CI_COMMIT_BRANCH}..."
            curl -sf -X POST \
              --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
              "https://gitlab.com/api/v4/projects/${proj_id}/pipelines/${PID}/cancel" || true
          done
        done
      }
      cancel_sibling "${GNOME_PROJECT_ID}"  "rakuos-gnome"
      cancel_sibling "${KDE_PROJECT_ID}"    "rakuos-kde"
      cancel_sibling "${COSMIC_PROJECT_ID}" "rakuos-cosmic"
      CUTOFF="$(date -u -d '20 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"
      RECENT=$(curl -sf \
        --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
        "https://gitlab.com/api/v4/projects/${BASE_PROJECT_ID}/pipelines?ref=${CI_COMMIT_BRANCH}&updated_after=${CUTOFF}&per_page=5" \
        | jq 'length')
      if [ "${RECENT}" -gt 0 ]; then
        echo "Base rebuild already triggered recently (${RECENT} pipeline(s)). Skipping."
      else
        echo "Triggering base rebuild on rakuos-base/${CI_COMMIT_BRANCH}..."
        curl -sf -X POST \
          --form "token=${TRIGGER_TOKEN_BASE}" \
          --form "ref=${CI_COMMIT_BRANCH}" \
          "https://gitlab.com/api/v4/projects/${BASE_PROJECT_ID}/trigger/pipeline"
        echo "Base rebuild triggered."
      fi
      echo "Cancelling own pipeline ${CI_PIPELINE_ID}..."
      curl -sf -X POST \
        --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
        "https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/pipelines/${CI_PIPELINE_ID}/cancel" || true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_failure
    - if: '$CI_COMMIT_BRANCH == "staging"'
      when: on_failure
    - if: '$CI_COMMIT_BRANCH == "rawhide"'
      when: on_failure
    - if: '$CI_COMMIT_BRANCH == "rakuosel"'
      when: on_failure

trigger-on-base-build-fail:
  extends: .trigger-on-build-fail
  needs:
    - job: build-base
      artifacts: false

trigger-on-nvidia-build-fail:
  extends: .trigger-on-build-fail
  needs:
    - job: build-nvidia
      artifacts: false

# ============================================================
# ISO Build Tests + Immediate Failure Response
# ============================================================
# Requires group CI/CD variables:
#   BASE_PROJECT_ID     — numeric GitLab project ID of rakuos-base
#   TRIGGER_TOKEN_BASE  — pipeline trigger token for rakuos-base
#   GITLAB_API_TOKEN    — api-scoped token for dedup check + pipeline cancellation
#   GNOME_PROJECT_ID    — numeric GitLab project ID of rakuos-gnome
#   KDE_PROJECT_ID      — numeric GitLab project ID of rakuos-kde
#   COSMIC_PROJECT_ID   — numeric GitLab project ID of rakuos-cosmic

.iso-test-job:
  image: quay.io/fedora/fedora:latest
  tags:
    - saas-linux-2xlarge-amd64
  timeout: 75 minutes
  before_script:
    - |
      set -euo pipefail
      dnf install -y \
        git \
        just \
        podman \
        jq \
        curl \
        findutils \
        tar \
        xorriso \
        dosfstools \
        grub2 \
        grub2-efi \
        grub2-tools \
        grub2-tools-extra \
        grub2-efi-x64 \
        grub2-efi-x64-cdboot \
        grub2-efi-x64-modules \
        shim \
        squashfs-tools \
        erofs-utils \
        policycoreutils
      case "${CI_COMMIT_BRANCH}" in
        "${CI_DEFAULT_BRANCH}") export BRANCH_SLUG="latest"    ;;
        "staging")              export BRANCH_SLUG="staging"   ;;
        "rawhide")              export BRANCH_SLUG="rawhide"   ;;
        "rakuosel")             export BRANCH_SLUG="rakuosel"  ;;
        *)                      export BRANCH_SLUG="$(printf '%s' "${CI_COMMIT_BRANCH}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._-]#-#g')" ;;
      esac
      git clone --depth 1 --branch "${TITANOBOA_REF}" "${TITANOBOA_REPO}" rakuos-forge
      git clone --depth 1 "${ISO_CONFIG_REPO}" iso-config
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "staging"'
    - if: '$CI_COMMIT_BRANCH == "rawhide"'
    - if: '$CI_COMMIT_BRANCH == "rakuosel"'

test-iso-standard:
  extends: .iso-test-job
  stage: test-iso
  needs:
    - job: build-base
      artifacts: false
  script:
    - |
      set -euo pipefail
      export IMAGE_REF="${IMAGE_REGISTRY}:ci-temp-${CI_PIPELINE_ID}"
      export TITANOBOA_BUILDER_DISTRO="fedora"
      export HOOK_post_rootfs="${CI_PROJECT_DIR}/iso-config/config/configure-iso.sh"
      export HOOK_pre_initramfs="${CI_PROJECT_DIR}/iso-config/config/pre_initramfs.sh"
      echo "Testing ISO build for ${IMAGE_REF}..."
      just -f rakuos-forge/Justfile build "${IMAGE_REF}" 1 none squashfs NONE "${IMAGE_REF}" 1
      echo "ISO build succeeded."

test-iso-nvidia:
  extends: .iso-test-job
  stage: test-iso
  needs:
    - job: build-nvidia
      artifacts: false
  script:
    - |
      set -euo pipefail
      export IMAGE_REF="${IMAGE_REGISTRY_NVIDIA}:ci-temp-${CI_PIPELINE_ID}"
      export TITANOBOA_BUILDER_DISTRO="fedora"
      export HOOK_post_rootfs="${CI_PROJECT_DIR}/iso-config/config/configure-iso.sh"
      export HOOK_pre_initramfs="${CI_PROJECT_DIR}/iso-config/config/pre_initramfs.sh"
      echo "Testing ISO build for ${IMAGE_REF}..."
      just -f rakuos-forge/Justfile build "${IMAGE_REF}" 1 none squashfs NONE "${IMAGE_REF}" 1
      echo "ISO build succeeded."

.trigger-on-iso-fail:
  stage: test-iso
  image: quay.io/fedora/fedora:latest
  tags:
    - saas-linux-2xlarge-amd64
  allow_failure: true
  script:
    - |
      set -euo pipefail
      dnf install -y curl jq
      echo "Cleaning up temp tags for pipeline ${CI_PIPELINE_ID}..."
      TEMP_TAG_NAME="ci-temp-${CI_PIPELINE_ID}"
      REPOS=$(curl -sf --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
        "https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/registry/repositories?per_page=20")
      for REPO_ID in $(echo "${REPOS}" | grep -o '"id":[0-9]*' | grep -o '[0-9]*'); do
        curl -sf -X DELETE \
          --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
          "https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/registry/repositories/${REPO_ID}/tags/${TEMP_TAG_NAME}" || true
      done
      echo "Temp tag cleanup complete."
      echo "Re-triggering ${CI_PROJECT_NAME} pipeline on ${CI_COMMIT_BRANCH}..."
      curl -sf -X POST \
        --form "token=${TRIGGER_TOKEN_SELF}" \
        --form "ref=${CI_COMMIT_BRANCH}" \
        "https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/trigger/pipeline"
      echo "Pipeline re-triggered."
      echo "Cancelling own pipeline ${CI_PIPELINE_ID}..."
      curl -sf -X POST \
        --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
        "https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/pipelines/${CI_PIPELINE_ID}/cancel" || true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_failure
    - if: '$CI_COMMIT_BRANCH == "staging"'
      when: on_failure
    - if: '$CI_COMMIT_BRANCH == "rawhide"'
      when: on_failure
    - if: '$CI_COMMIT_BRANCH == "rakuosel"'
      when: on_failure

trigger-on-iso-standard-fail:
  extends: .trigger-on-iso-fail
  needs:
    - job: test-iso-standard
      artifacts: false

trigger-on-iso-nvidia-fail:
  extends: .trigger-on-iso-fail
  needs:
    - job: test-iso-nvidia
      artifacts: false

push-tags-base:
  stage: push
  image: quay.io/buildah/stable:latest
  tags:
    - saas-linux-2xlarge-amd64
  needs:
    - job: test-iso-standard
      artifacts: false
    - job: test-iso-nvidia
      artifacts: false
  script:
    - |
      set -euo pipefail
      case "${CI_COMMIT_BRANCH}" in
        "${CI_DEFAULT_BRANCH}") BRANCH_SLUG="${DEFAULT_TAG}" ;;
        "staging")              BRANCH_SLUG="staging"        ;;
        "rawhide")              BRANCH_SLUG="rawhide"        ;;
        "rakuosel")             BRANCH_SLUG="rakuosel"       ;;
        *)                      BRANCH_SLUG="$(printf '%s' "${CI_COMMIT_BRANCH}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._-]#-#g')" ;;
      esac
      DATE_TAG="$(date -u +%Y%m%d)"
      TEMP_TAG="${IMAGE_REGISTRY}:ci-temp-${CI_PIPELINE_ID}"
      buildah login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" registry.gitlab.com
      buildah pull "docker://${TEMP_TAG}"
      if [ "${CI_COMMIT_BRANCH}" = "${CI_DEFAULT_BRANCH}" ]; then
        FINAL_TAGS="${IMAGE_REGISTRY}:${DEFAULT_TAG} ${IMAGE_REGISTRY}:${DEFAULT_TAG}.${DATE_TAG} ${IMAGE_REGISTRY}:${DATE_TAG}"
      else
        FINAL_TAGS="${IMAGE_REGISTRY}:${BRANCH_SLUG} ${IMAGE_REGISTRY}:${BRANCH_SLUG}.${DATE_TAG}"
      fi
      for tag in ${FINAL_TAGS}; do
        echo "Pushing ${tag}..."
        buildah push "${TEMP_TAG}" "docker://${tag}"
      done
      echo "All final tags pushed."
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "staging"'
    - if: '$CI_COMMIT_BRANCH == "rawhide"'
    - if: '$CI_COMMIT_BRANCH == "rakuosel"'

push-tags-nvidia:
  stage: push
  image: quay.io/buildah/stable:latest
  tags:
    - saas-linux-2xlarge-amd64
  needs:
    - job: test-iso-standard
      artifacts: false
    - job: test-iso-nvidia
      artifacts: false
  script:
    - |
      set -euo pipefail
      case "${CI_COMMIT_BRANCH}" in
        "${CI_DEFAULT_BRANCH}") BRANCH_SLUG="${DEFAULT_TAG}" ;;
        "staging")              BRANCH_SLUG="staging"        ;;
        "rawhide")              BRANCH_SLUG="rawhide"        ;;
        "rakuosel")             BRANCH_SLUG="rakuosel"       ;;
        *)                      BRANCH_SLUG="$(printf '%s' "${CI_COMMIT_BRANCH}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._-]#-#g')" ;;
      esac
      DATE_TAG="$(date -u +%Y%m%d)"
      TEMP_TAG="${IMAGE_REGISTRY_NVIDIA}:ci-temp-${CI_PIPELINE_ID}"
      buildah login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" registry.gitlab.com
      buildah pull "docker://${TEMP_TAG}"
      if [ "${CI_COMMIT_BRANCH}" = "${CI_DEFAULT_BRANCH}" ]; then
        FINAL_TAGS="${IMAGE_REGISTRY_NVIDIA}:${DEFAULT_TAG} ${IMAGE_REGISTRY_NVIDIA}:${DEFAULT_TAG}.${DATE_TAG} ${IMAGE_REGISTRY_NVIDIA}:${DATE_TAG}"
      else
        FINAL_TAGS="${IMAGE_REGISTRY_NVIDIA}:${BRANCH_SLUG} ${IMAGE_REGISTRY_NVIDIA}:${BRANCH_SLUG}.${DATE_TAG}"
      fi
      for tag in ${FINAL_TAGS}; do
        echo "Pushing ${tag}..."
        buildah push "${TEMP_TAG}" "docker://${tag}"
      done
      echo "All final tags pushed."
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "staging"'
    - if: '$CI_COMMIT_BRANCH == "rawhide"'
    - if: '$CI_COMMIT_BRANCH == "rakuosel"'

cleanup-temp-tags:
  stage: cleanup
  image: quay.io/buildah/stable:latest
  tags:
    - saas-linux-2xlarge-amd64
  when: always
  script:
    - |
      set -euo pipefail
      buildah login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" registry.gitlab.com
      echo "Deleting temp tags for pipeline ${CI_PIPELINE_ID}..."
      TEMP_TAG_NAME="ci-temp-${CI_PIPELINE_ID}"
      REPOS=$(curl -sf --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
        "https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/registry/repositories?per_page=20")
      for REPO_ID in $(echo "${REPOS}" | grep -o '"id":[0-9]*' | grep -o '[0-9]*'); do
        curl -sf -X DELETE \
          --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
          "https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/registry/repositories/${REPO_ID}/tags/${TEMP_TAG_NAME}" || true
      done
      echo "Temp tag cleanup complete."
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: always
    - if: '$CI_COMMIT_BRANCH == "staging"'
      when: always
    - if: '$CI_COMMIT_BRANCH == "rawhide"'
      when: always
    - if: '$CI_COMMIT_BRANCH == "rakuosel"'
      when: always
