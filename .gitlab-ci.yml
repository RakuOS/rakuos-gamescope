# ============================================================
# RakuOS KDE Image — GitLab CI/CD Pipeline
# ============================================================

variables:
  IMAGE_REGISTRY: "registry.gitlab.com/rakuos/images/rakuos-kde"
  IMAGE_REGISTRY_NVIDIA: "registry.gitlab.com/rakuos/images/rakuos-kde/nvidia"
  DEFAULT_TAG: "latest"
  IMAGE_DESC: "RakuOS KDE"
  IMAGE_KEYWORDS: "bootc,fedora,atomic,kde,plasma"

stages:
  - build-push

.buildah-job:
  image: quay.io/buildah/stable:latest
  tags:
    - saas-linux-2xlarge-amd64
  before_script:
    - |
      if [ "${CI_COMMIT_BRANCH}" = "${CI_DEFAULT_BRANCH}" ]; then
        export BASE_IMAGE_TAG="${DEFAULT_TAG}"
      else
        export BASE_IMAGE_TAG="$(printf '%s' "${CI_COMMIT_BRANCH}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._-]#-#g')"
      fi
      echo "Pulling base image tag: ${BASE_IMAGE_TAG}"
    - export DATE_TAG="$(date -u +%Y%m%d)"
  variables:
    STORAGE_DRIVER: overlay
    BUILDAH_FORMAT: docker

build-push-base:
  extends: .buildah-job
  stage: build-push
  script:
    - printf 'TAGS=\nBRANCH_SLUG=\n' > build-base.env

    - |
      if [ "${CI_COMMIT_BRANCH}" = "${CI_DEFAULT_BRANCH}" ]; then
        TAGS="${IMAGE_REGISTRY}:${DEFAULT_TAG} ${IMAGE_REGISTRY}:${DEFAULT_TAG}.${DATE_TAG} ${IMAGE_REGISTRY}:${DATE_TAG}"
        BRANCH_SLUG="${DEFAULT_TAG}"
      else
        BRANCH_SLUG="$(printf '%s' "${CI_COMMIT_BRANCH}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._-]#-#g')"
        TAGS="${IMAGE_REGISTRY}:${BRANCH_SLUG} ${IMAGE_REGISTRY}:${BRANCH_SLUG}.${DATE_TAG}"
      fi
      export TAGS BRANCH_SLUG
      printf 'TAGS=%s\nBRANCH_SLUG=%s\n' "${TAGS}" "${BRANCH_SLUG}" > build-base.env

    - buildah login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" registry.gitlab.com

    - export TEMP_TAG="${IMAGE_REGISTRY}:ci-temp-${CI_PIPELINE_ID}"

    - |
      buildah build \
        --file Containerfile \
        --build-arg BASE_IMAGE_TAG="${BASE_IMAGE_TAG}" \
        --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        --label "org.opencontainers.image.description=${IMAGE_DESC}" \
        --label "org.opencontainers.image.source=${CI_PROJECT_URL}" \
        --label "org.opencontainers.image.revision=${CI_COMMIT_SHA}" \
        --label "org.opencontainers.image.vendor=RakuOS" \
        --label "org.opencontainers.image.keywords=${IMAGE_KEYWORDS}" \
        --label "containers.bootc=1" \
        --tag "${TEMP_TAG}" \
        .

    - |
      for tag in ${TAGS}; do
        echo "Tagging ${TEMP_TAG} as ${tag}"
        buildah tag "${TEMP_TAG}" "${tag}"
      done

    - |
      if [ "${CI_PIPELINE_SOURCE}" != "merge_request_event" ]; then
        for tag in ${TAGS}; do
          echo "Pushing ${tag}"
          buildah push "${tag}"
        done
      fi
  artifacts:
    reports:
      dotenv: build-base.env
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "staging"'

build-push-nvidia:
  extends: .buildah-job
  stage: build-push
  script:
    - printf 'TAGS_NVIDIA=\nBRANCH_SLUG=\n' > build-nvidia.env

    - |
      if [ "${CI_COMMIT_BRANCH}" = "${CI_DEFAULT_BRANCH}" ]; then
        TAGS="${IMAGE_REGISTRY_NVIDIA}:${DEFAULT_TAG} ${IMAGE_REGISTRY_NVIDIA}:${DEFAULT_TAG}.${DATE_TAG} ${IMAGE_REGISTRY_NVIDIA}:${DATE_TAG}"
        BRANCH_SLUG="${DEFAULT_TAG}"
      else
        BRANCH_SLUG="$(printf '%s' "${CI_COMMIT_BRANCH}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._-]#-#g')"
        TAGS="${IMAGE_REGISTRY_NVIDIA}:${BRANCH_SLUG} ${IMAGE_REGISTRY_NVIDIA}:${BRANCH_SLUG}.${DATE_TAG}"
      fi
      export TAGS BRANCH_SLUG
      printf 'TAGS_NVIDIA=%s\nBRANCH_SLUG=%s\n' "${TAGS}" "${BRANCH_SLUG}" > build-nvidia.env

    - buildah login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" registry.gitlab.com

    - export TEMP_TAG="${IMAGE_REGISTRY_NVIDIA}:ci-temp-${CI_PIPELINE_ID}"

    - |
      buildah build \
        --file Containerfile.nvidia \
        --build-arg BASE_IMAGE_TAG="${BASE_IMAGE_TAG}" \
        --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        --label "org.opencontainers.image.description=${IMAGE_DESC} (NVIDIA)" \
        --label "org.opencontainers.image.source=${CI_PROJECT_URL}" \
        --label "org.opencontainers.image.revision=${CI_COMMIT_SHA}" \
        --label "org.opencontainers.image.vendor=RakuOS" \
        --label "org.opencontainers.image.keywords=${IMAGE_KEYWORDS}" \
        --label "containers.bootc=1" \
        --tag "${TEMP_TAG}" \
        .

    - |
      for tag in ${TAGS}; do
        echo "Tagging ${TEMP_TAG} as ${tag}"
        buildah tag "${TEMP_TAG}" "${tag}"
      done

    - |
      if [ "${CI_PIPELINE_SOURCE}" != "merge_request_event" ]; then
        for tag in ${TAGS}; do
          echo "Pushing ${tag}"
          buildah push "${tag}"
        done
      fi
  artifacts:
    reports:
      dotenv: build-nvidia.env
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "staging"'
